version: '3.8'

services:
  # 1. Dr. Occam (Nosso Sistema Central em FastAPI)
  # Único container: a extração de conteúdo roda in-process via trafilatura,
  # sem depender de um microsserviço externo de scraping/renderização.
  api-occam:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: dr_occam_api
    ports:
      - "8383:8000" # Porta para acessar a interface e o feed RSS
    volumes:
      - ./app:/app  # Mapeamento do código para hot-reload
      - ./app/data:/app/data # Persistência do banco de dados SQLite
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
    # Teto de memória/CPU: sem isso, um pico de uso (ex.: várias extrações de
    # página concorrentes) não tem limite nenhum dentro do container e pode
    # consumir toda a RAM do host — como o host não tem swap configurado,
    # isso aciona o OOM killer contra o sistema inteiro, derrubando outros
    # containers sem relação nenhuma com o Dr. Occam (ex.: Plex, Datasette).
    # Usa mem_limit/cpus (não deploy.resources.limits) porque este projeto
    # roda com `docker compose up` fora do modo swarm — deploy.resources só
    # é respeitado em `docker stack deploy`.
    mem_limit: 2g
    cpus: 2.0
    networks:
      - occam_network

  # 2. RSSHub (Gerador de feeds RSS para sites que não possuem nativamente)
  # Usado como fonte alternativa: sites sem RSS passam a ser cadastrados no
  # Dr. Occam como uma fonte RSS normal, apontando para a rota gerada aqui
  # (ex.: http://rsshub:1200/algumSite), sem exigir raspagem de HTML no
  # sistema central.
  rsshub:
    image: diygod/rsshub:2026-07-24
    container_name: rsshub
    restart: unless-stopped
    ports:
      - "1200:1200"
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    mem_limit: 512m
    cpus: 1.0
    networks:
      - occam_network

networks:
  occam_network:
    driver: bridge

